[package]
name = "identify"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
reqwest = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid" ] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
dotenvy = "0.15.7"
futures = "0.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "5.5.0", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
redis = { version = "1.7.0", features = ["tokio-comp"] }
derive_more = { version = "2.1.1", features = ["display", "from"] }
argon2 = "0.6.0"
