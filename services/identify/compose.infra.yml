services:
  postgres:
    image: postgres:17-alpine
    container_name: identify-postgres
    restart: always
    environment:
      POSTGRES_USER: identify_user
      POSTGRES_PASSWORD: identify_password
      POSTGRES_DB: identifydb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - identify-pgdata:/var/lib/postgresql/data
    networks:
      - identify-infra

  identify-redis:
    image: redis:7-alpine
    container_name: identify-redis
    restart: always
    volumes:
      - identify-redisdata:/data
    networks:
      - identify-infra

volumes:
  identify-pgdata:
  identify-redisdata:

networks:
  identify-infra:
    name: identify-infra
