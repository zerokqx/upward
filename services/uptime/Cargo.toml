[package]
name = "uptime"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
reqwest = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid" ] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
