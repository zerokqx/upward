language: 'rust'
layer: 'application'

env:
  CARGO_TERM_COLOR: 'always'

fileGroups:
  sources:
    - 'src/**/*'
    - 'crates/*/src/**/*'
    - 'crates/*/Cargo.toml'
    - 'Cargo.toml'
  tests:
    - 'tests/**/*'
    - 'crates/*/benches/**/*'
    - 'crates/*/tests/**/*'
  migrations:
    - 'migrations/**/*'

tasks:
  run: 
    command: 'cargo run'
    inputs:
      - '@globs(sources)'
  build:
    command: 'cargo build'
    inputs:
      - '@globs(sources)'
  check:
    command: 'cargo check --workspace'
    inputs:
      - '@globs(sources)'
  format:
    command: 'cargo fmt --all --check'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
  lint:
    command: 'cargo clippy --workspace'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
  test:
    command: 'cargo test --workspace'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
  migrate:
    command: 'sqlx migrate run'
    inputs:
      - '@globs(migrations)'
      - '.env'
    options:
      cache: false
  migrate-run:
    command: 'sqlx migrate run'
    inputs:
      - '@globs(migrations)'
      - '.env'
    options:
      cache: false
  migrate-status:
    command: 'sqlx migrate info'
    inputs:
      - '@globs(migrations)'
      - '.env'
    options:
      cache: false

